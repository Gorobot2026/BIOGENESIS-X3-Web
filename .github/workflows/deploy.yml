name: BIOGENESIS X3 - Deploy Built Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read project source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Use Node.js 22 on GitHub (not on students' computers)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React for the correct GitHub Pages path
        run: pnpm exec vite build --config vite.github.config.ts

      - name: Confirm index.html is built, not Figma source
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q 'src/main.tsx' dist/index.html; then
            echo 'ERROR: dist/index.html still points at TSX source.'
            exit 1
          fi
          echo 'Built index.html and assets verified.'
          grep -o '/BIOGENESIS-X3-Web/assets/[^" ]*' dist/index.html || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website, not repository source
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
