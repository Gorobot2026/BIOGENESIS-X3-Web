name: Deploy BIOGENESIS X3 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite app for GitHub Pages
        env:
          FIGMA_PUBLIC_URL: /BIOGENESIS-X3-Web
        run: pnpm run build

      - name: Verify built output
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'ERROR: dist/index.html still points to React/TSX source'
            exit 1
          fi
          echo 'Build output verified'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
